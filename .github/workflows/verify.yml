name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      compile_required: ${{ steps.plan.outputs.compile_required }}
      mode: ${{ steps.plan.outputs.mode }}
      repeats: ${{ steps.plan.outputs.repeats }}
    steps:
      - name: Checkout dependency snapshots
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select affected verification targets
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/plan_verification.py
      - name: Upload auditable selection
        uses: actions/upload-artifact@v4
        with:
          name: ci-plan
          path: |
            .verification/ci-plan.json
            .verification/ci-doc-examples.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  compile:
    name: compile (${{ matrix.compiler }}, ${{ matrix.standard }})
    needs: plan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cxx: g++
            standard: gnu++20
          - compiler: GCC
            cxx: g++
            standard: gnu++23
          - compiler: Clang
            cxx: clang++
            standard: gnu++20
          - compiler: Clang
            cxx: clang++
            standard: gnu++23

    steps:
      - name: Require successful selection planning
        run: test '${{ needs.plan.result }}' = success

      - name: Checkout
        if: needs.plan.outputs.compile_required == 'true'
        uses: actions/checkout@v7

      - name: Install AtCoder Library headers
        if: needs.plan.outputs.compile_required == 'true'
        uses: actions/checkout@v7
        with:
          repository: atcoder/ac-library
          ref: 864245a00b00dd008d1abfdc239618fdb7d139da
          path: .deps/ac-library
          persist-credentials: false

      - name: Install arbitrary-precision test dependency
        if: needs.plan.outputs.compile_required == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libboost-dev

      - name: Compile headers and verify programs
        if: needs.plan.outputs.compile_required == 'true'
        env:
          CPPFLAGS: -I.deps/ac-library
        run: make compile-test CXX=${{ matrix.cxx }} CXX_STANDARD=${{ matrix.standard }}

      - name: Compile release headers
        if: needs.plan.outputs.compile_required == 'true'
        env:
          CXXFLAGS: -DNDEBUG
          CPPFLAGS: -isystem .deps/ac-library
        run: make include-test CXX=${{ matrix.cxx }} CXX_STANDARD=${{ matrix.standard }}

      - name: Run randomized tests
        if: needs.plan.outputs.compile_required == 'true'
        env:
          CPPFLAGS: -I.deps/ac-library
        run: make random-test CXX=${{ matrix.cxx }} CXX_STANDARD=${{ matrix.standard }}

      - name: Run Tree and Data Structure differential tests
        if: needs.plan.outputs.compile_required == 'true'
        env:
          CXX: ${{ matrix.cxx }}
          CXX_STANDARD: ${{ matrix.standard }}
        run: python3 -m unittest discover -s tests -p "test_*random.py" -v && python3 -m unittest discover -s tests -p test_data_structures.py -v

      - name: No C++ changes
        if: needs.plan.outputs.compile_required != 'true'
        run: echo 'C++ compile/random suites intentionally not selected; required job remains present.'

  verify:
    needs: [plan, compile]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      pages: write

    steps:
      - name: Require successful planning and compile gates
        run: test '${{ needs.plan.result }}' = success && test '${{ needs.compile.result }}' = success

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download verification selection
        uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: .verification

      - name: Revalidate selection against checked-out sources
        run: |
          python3 - <<'PY'
          import json
          from scripts.plan_verification import validate_plan
          validate_plan(json.load(open('.verification/ci-plan.json')))
          PY

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Cache verification data
        uses: actions/cache@v4
        with:
          path: |
            .verify-helper/cache
            .verify-helper/timestamps.remote.json
          key: verify-${{ runner.os }}-${{ github.sha }}
          restore-keys: verify-${{ runner.os }}-

      - name: Install verification-helper
        run: python -m pip install --requirement requirements-dev.txt

      - name: Install AtCoder Library headers
        uses: actions/checkout@v7
        with:
          repository: atcoder/ac-library
          ref: 864245a00b00dd008d1abfdc239618fdb7d139da
          path: .deps/ac-library
          persist-credentials: false

      - name: Expose pinned ACL to verification-helper
        run: |
          cp -R .deps/ac-library/atcoder .

      - name: Test measurement code and documentation examples
        env:
          CPPFLAGS: -I.deps/ac-library
        run: |
          if [ '${{ needs.plan.outputs.compile_required }}' = true ]; then
            make test
          else
            python3 scripts/run_ci_unit_tests.py --without-cpp
            python3 scripts/library_checker_coverage.py --check
            python3 scripts/check_docs.py --paths-file .verification/ci-doc-examples.json
          fi

      - name: Smoke-test benchmark runner
        if: needs.plan.outputs.compile_required == 'true'
        run: make benchmark-smoke

      - name: Generate documentation for preflight
        run: make docs

      - name: Build documentation before full verification
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./.verify-helper/markdown
          destination: ./.build/site

      - name: Check documentation structure
        run: python scripts/check_site.py --without-metrics

      - name: Restore last successful main benchmark
        id: benchmark-baseline
        uses: actions/cache/restore@v4
        with:
          path: .verification/baseline.json
          key: benchmark-v1-${{ runner.os }}-${{ hashFiles('requirements-dev.txt', '.verify-helper/config.toml', 'scripts/verify_with_metrics.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: benchmark-v1-${{ runner.os }}-${{ hashFiles('requirements-dev.txt', '.verify-helper/config.toml', 'scripts/verify_with_metrics.py') }}-

      - name: Verify libraries
        env:
          CPLUS_INCLUDE_PATH: ${{ github.workspace }}/.deps/ac-library
        run: python3 scripts/verify_with_metrics.py --plan .verification/ci-plan.json --repeats ${{ needs.plan.outputs.repeats }} --timeout 3600

      - name: Upload verification measurements (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-metrics
          path: |
            .verification/ci-plan.json
            .verification/ci-doc-examples.json
            .verification/current.json
            .verification/report.md
            .verification/run-*/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

      - name: Generate documentation
        run: make docs

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Build GitHub Pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./.verify-helper/markdown
          destination: ./.build/site

      - name: Check generated documentation
        run: python scripts/check_site.py

      - name: Prepare main benchmark baseline
        if: github.ref == 'refs/heads/main' && needs.plan.outputs.mode == 'full' && needs.plan.outputs.repeats == '3'
        run: cp .verification/current.json .verification/baseline.json

      - name: Save main benchmark baseline
        if: github.ref == 'refs/heads/main' && needs.plan.outputs.mode == 'full' && needs.plan.outputs.repeats == '3'
        uses: actions/cache/save@v4
        with:
          path: .verification/baseline.json
          key: ${{ steps.benchmark-baseline.outputs.cache-primary-key }}

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.build/site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
