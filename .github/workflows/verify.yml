name: Sharded full verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install verification-helper
        run: python3 -m pip install --requirement requirements-dev.txt
      - name: Install pinned AtCoder Library
        uses: actions/checkout@v7
        with:
          repository: atcoder/ac-library
          ref: 864245a00b00dd008d1abfdc239618fdb7d139da
          path: .deps/ac-library
          persist-credentials: false
      - name: Run one quarter of all official verify targets three times
        shell: bash
        env:
          CPLUS_INCLUDE_PATH: ${{ github.workspace }}/.deps/ac-library
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mkdir -p ".verification/shard-$SHARD"
          git rev-parse HEAD > ".verification/shard-$SHARD/revision.txt"
          python3 -c 'import os,pathlib; p=sorted(pathlib.Path("verify").rglob("*.test.cpp")); s=int(os.environ["SHARD"]); q=[str(x) for i,x in enumerate(p) if i%4==s]; print("\n".join(q))' > ".verification/shard-$SHARD/targets.txt"
          mapfile -t targets < ".verification/shard-$SHARD/targets.txt"
          test "${#targets[@]}" -gt 0
          python3 scripts/verify_with_metrics.py --repeats 3 --timeout 6000 --output ".verification/shard-$SHARD" "${targets[@]}" 2>&1 | tee ".verification/shard-$SHARD/console.log"
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-verification-shard-${{ matrix.shard }}
          path: .verification/shard-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
