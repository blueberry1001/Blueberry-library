name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: compile (${{ matrix.compiler }}, ${{ matrix.standard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cxx: g++
            standard: gnu++20
          - compiler: GCC
            cxx: g++
            standard: gnu++23
          - compiler: Clang
            cxx: clang++
            standard: gnu++20
          - compiler: Clang
            cxx: clang++
            standard: gnu++23

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install AtCoder Library headers
        run: git clone --depth 1 https://github.com/atcoder/ac-library.git "$RUNNER_TEMP/ac-library"

      - name: Compile headers and verify programs
        env:
          CPPFLAGS: -I${{ runner.temp }}/ac-library
        run: make compile-test CXX=${{ matrix.cxx }} CXX_STANDARD=${{ matrix.standard }}

      - name: Run randomized tests
        env:
          CPPFLAGS: -I${{ runner.temp }}/ac-library
        run: make random-test CXX=${{ matrix.cxx }} CXX_STANDARD=${{ matrix.standard }}

      - name: Run Tree and Data Structure differential tests
        env:
          CXX: ${{ matrix.cxx }}
          CXX_STANDARD: ${{ matrix.standard }}
        run: python3 -m unittest discover -s tests -p "test_*random.py" -v && python3 -m unittest discover -s tests -p test_data_structures.py -v

  verify:
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Cache verification data
        uses: actions/cache@v4
        with:
          path: |
            .verify-helper/cache
            .verify-helper/timestamps.remote.json
          key: verify-${{ runner.os }}-${{ github.sha }}
          restore-keys: verify-${{ runner.os }}-

      - name: Install verification-helper
        run: python -m pip install --requirement requirements-dev.txt

      - name: Install AtCoder Library headers
        run: |
          git clone --depth 1 https://github.com/atcoder/ac-library.git "$RUNNER_TEMP/ac-library"
          cp -R "$RUNNER_TEMP/ac-library/atcoder" .

      - name: Test measurement code and documentation examples
        run: make test

      - name: Smoke-test benchmark runner
        run: make benchmark-smoke

      - name: Generate documentation for preflight
        run: make docs

      - name: Build documentation before full verification
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./.verify-helper/markdown
          destination: ./.build/site

      - name: Check documentation structure
        run: python scripts/check_site.py --without-metrics

      - name: Restore last successful main benchmark
        id: benchmark-baseline
        uses: actions/cache/restore@v4
        with:
          path: .verification/baseline.json
          key: benchmark-v1-${{ runner.os }}-${{ hashFiles('requirements-dev.txt', '.verify-helper/config.toml', 'scripts/verify_with_metrics.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: benchmark-v1-${{ runner.os }}-${{ hashFiles('requirements-dev.txt', '.verify-helper/config.toml', 'scripts/verify_with_metrics.py') }}-

      - name: Verify libraries
        run: make verify

      - name: Upload verification measurements (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-metrics
          path: |
            .verification/current.json
            .verification/report.md
            .verification/run-*/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

      - name: Generate documentation
        run: make docs

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Build GitHub Pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./.verify-helper/markdown
          destination: ./.build/site

      - name: Check generated documentation
        run: python scripts/check_site.py

      - name: Prepare main benchmark baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp .verification/current.json .verification/baseline.json

      - name: Save main benchmark baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .verification/baseline.json
          key: ${{ steps.benchmark-baseline.outputs.cache-primary-key }}

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.build/site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
