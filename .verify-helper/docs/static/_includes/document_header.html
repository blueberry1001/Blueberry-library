<h1 data-verification-status="{{ page.data.verificationStatus | escape }}">{{ page.data._verificationStatusIcon }} {{ page.title | escape }}</h1>
{% if page.data._pathExtension == 'hpp' %}
<div class="document-meta document-include">
  <code id="include-directive-code">#include "{{ page.data.path | escape }}"</code>
  <button type="button" id="copy-include">コピー</button>
  <span id="copy-include-status" role="status"></span>
</div>
<nav class="document-jumps" aria-label="このページの内容">
  <a href="#source-code">実装</a>
  <a href="#document-references">関連情報</a>
</nav>
{% elsif page.title != page.data.path %}
<p class="document-path"><code>{{ page.data.path | escape }}</code></p>
{% endif %}
