<h2 id="source-code">実装</h2>
<div data-source-viewer>
{% if page.data.bundledCode %}
<div class="code-actions source-actions" data-source-actions hidden>
  <span role="status" data-source-status></span>
  <button type="button" data-source-copy>コードをコピー</button>
  <button type="button" data-source-toggle aria-controls="unbundled bundled-source" aria-pressed="false">Bundle</button>
</div>
{% endif %}
<div id="unbundled">
{% include highlight.html extension=page.data._pathExtension content=page.data.code %}
</div>

{% if page.data.bundledCode %}
<div class="bundled-source" id="bundled-source">
  <span id="bundled"></span>
  <h3 class="source-fallback-note">依存ヘッダを展開したコード</h3>
  {% include highlight.html extension=page.data._pathExtension content=page.data.bundledCode %}
</div>
{% endif %}
</div>
