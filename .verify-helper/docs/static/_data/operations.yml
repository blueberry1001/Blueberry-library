    -
      id: "range-gcd"
      label: "区間のgcd"
    -
      id: "aggregate"
      label: "区間の積・関数合成"
    -
      id: "whole-aggregate"
      label: "列全体の積・関数合成"
    -
      id: "xor-min"
      label: "XORの最小値"
    -
      id: "range-kth"
      label: "k番目・順位"
    -
      id: "frequency"
      label: "個数・値域内の頻度"
    -
      id: "predecessor"
