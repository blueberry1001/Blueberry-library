    - id: "contour-add"
      label: "木の距離帯（等高線）に加算"
    - id: "range-assign"
      label: "区間を同じ値に代入"
    - id: "range-affine"
      label: "区間を affine 変換（a*x+b）"
    - id: "range-chmin"
